# goes to: cricket_dbt/profiles.yml
# dbt Projects on Snowflake runs inside your Snowflake session,
# so account/user are not used and there is no password here.
cricket_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: SYSADMIN
      database: LEAGUE_DB
      schema: DEV
      warehouse: LEAGUE_WH
      threads: 4
    prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: SYSADMIN
      database: LEAGUE_DB
      schema: PROD
      warehouse: LEAGUE_WH
      threads: 4
